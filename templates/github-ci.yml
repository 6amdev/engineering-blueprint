# CI — new-project วางไว้ที่ .github/workflows/ci.yml ให้แล้ว · ทำงานเองเมื่อ push ขึ้น GitHub (token ที่ push ต้องมีสิทธิ์ workflow: gh auth refresh -s workflow)
# รัน lint · test · build ของโปรเจกต์เองถ้ามี script ชื่อนั้นใน package.json · ระบบที่ไม่ใช่ Node เพิ่มขั้นของตัวเองท้ายไฟล์
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # audit ต้องเห็นทุก commit
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run secret-scan
      - name: gate audit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/gate.mjs audit "$BASE..$HEAD"
      - run: npm run gate:test
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build --if-present
      - run: npm run docs:build

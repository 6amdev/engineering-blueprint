# CI ตัวอย่าง — คัดลอกไป .github/workflows/ci.yml เมื่อมี remote บน GitHub แล้ว (token ที่ push ต้องมีสิทธิ์ workflow) · เพิ่ม job ของโปรเจกต์ (lint · test · build) ตามที่ AGENTS.md §8 ตั้ง
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run secret-scan
      - run: npm run gate:test
      - run: npm test --if-present
      - run: npm run docs:build

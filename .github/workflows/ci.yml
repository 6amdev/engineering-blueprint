# CI ของตัวหลัก = templates/github-ci.yml + เทสสร้าง/อัปเกรดโปรเจกต์ (โปรเจกต์ที่สร้างใหม่ไม่ได้ไฟล์นี้ คัดลอกจากแม่แบบเอง)
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # audit ต้องเห็นทุก commit
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run secret-scan
      - name: gate audit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/gate.mjs audit "$BASE..$HEAD"
      - run: npm run gate:test
      - name: create and upgrade a project
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          npm run project:test
      - run: npm run docs:build
